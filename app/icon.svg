<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>brFrame</title>
  <defs>
    <linearGradient id="brframe-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#991b1b" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="brframe-main" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="brframe-prism" x1="160" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>
    <radialGradient id="brframe-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Obsidian & Brand-Tinted Squircle Chassis -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0a0a0d" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#brframe-bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#brframe-main)" stroke-width="16" stroke-opacity="0.95" />

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="216" fill="url(#brframe-glow)" />

  <!-- Semiotic Viewfinder Corner Brackets -->
  <path d="M86 134V102C86 93.163 93.163 86 102 86H134" stroke="#f87171" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M378 86H410C418.837 86 426 93.163 426 102V134" stroke="#f87171" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M86 378V410C86 418.837 93.163 426 102 426H134" stroke="#f87171" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />
  <path d="M378 426H410C418.837 426 426 418.837 426 410V378" stroke="#f87171" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />

  <!-- Multi-Layer Bespoke Semiotic Geometry (1.06x Optical Presence Scale) -->
  <g transform="translate(256 256) scale(1.06) translate(-256 -256)">
    <line x1="128" y1="232" x2="348" y2="232" stroke="url(#brframe-main)" stroke-width="10" stroke-linecap="round" opacity="0.35" />
    <line x1="238" y1="148" x2="238" y2="316" stroke="url(#brframe-main)" stroke-width="10" stroke-linecap="round" opacity="0.35" />
    <rect x="130" y="148" width="216" height="168" rx="20" stroke="url(#brframe-main)" stroke-width="18" fill="none" />
    <line x1="292" y1="284" x2="380" y2="372" stroke="url(#brframe-main)" stroke-width="30" stroke-linecap="round" />
    <circle cx="244" cy="236" r="66" fill="url(#brframe-prism)" />
    <circle cx="244" cy="236" r="30" fill="#991b1b" />
    <circle cx="224" cy="216" r="10" fill="#ffffff" />
  </g>
